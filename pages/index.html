<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FIREBREAK</title>
    <meta
      name="description"
      content="Aim the fires, hold the line, and break a rogue legion. An incremental auto-battler."
    />
    <meta name="theme-color" content="#0c100e" />

    <!--
      Paths are relative so the build works at whatever path Pages serves it
      from — a project site lives under /<repo>/, a user site or a custom
      domain at the root, and this way the same bundle covers all three.
    -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./__grok/icon-180.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="FIREBREAK" />
    <meta
      property="og:description"
      content="Aim the fires, hold the line, and break a rogue legion. An incremental auto-battler."
    />
    <meta property="og:image" content="__BASE_URL__og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__BASE_URL__og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <!--
      Loaded as `print` and flipped to `all` once the app boots — the same
      deferred-font trick the router shell uses, and the boot effect in
      firebreak-app.tsx is what flips it.
    -->
    <link
      rel="stylesheet"
      media="print"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="boot" class="boot-screen">
      <div class="boot-panel">
        <p class="boot-title">FIREBREAK</p>
        <div
          id="boot-fill"
          class="boot-track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="4"
          aria-label="Loading"
        >
          <div class="boot-fill"></div>
        </div>
        <p id="boot-status" class="boot-status">Loading the line</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
    <script src="https://grok.com/grok-app-builder/extensions.js" defer></script>
  </body>
</html>
